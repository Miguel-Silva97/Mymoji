syntax = "proto3";

option java_package = "com.example.mymoji.core.data.proto";
option java_multiple_files = true;

// Everything displayed on the home screen header, most recent first.
message DisplayHistory {
  repeated DisplayedItem items = 1;
}

message DisplayedItem {
  oneof item {
    string emoji_name = 1;
    string github_login = 2;
  }
}
